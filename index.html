<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athena Assignment 1</title>
</head>
<body>
    <h2>Primary Button</h2>
    <span class="c-pill">Primary</span>
    <h2>Secondary Button</h2>
    <span class="c-pill-secondary">Secondary</span>
    <h2>Disabled Button</h2>
    <span class="c-pill-disabled">Disabled</span>
    <h2>Button #4!</h2>
    <span class="c-pill-colour-changing">Colour changing</span>
    <style>
        body {
            text-align: center;
        }
        .h2 {
            font-family: 'Arial', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .c-pill {
            display: inline-block;
            padding: 0.25em 0.75em;
            font-family:'Courier New', Courier, monospace
            font-size: 2rem;
            font-weight: 600;
            line-height: 1;
            color: #fff;
            background-color: #007bff;
            border-radius: 10rem;
        }
        .c-pill-secondary {
            display: inline-block;
            padding: 0.25em 0.75em;
            font-family: 'Arial', sans-serif;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1;
            color: #fff;
            background-color: #4760cd;
            border-radius: 10rem;
        }
        .c-pill-disabled {
            display: inline-block;
            padding: 0.25em 0.75em;
            font-family: 'Arial', sans-serif;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1;
            color: #6c6c6c;
            background-color: #bababa;
            border-radius: 10rem;
        }
        .c-pill-colour-changing {
            display: inline-block;
            padding: 1em 1.25em;
            font-family:Georgia, 'Times New Roman', Times, serif
            font-size: 15rem;
            font-weight: 600;
            line-height: 1;
            color: #fff;
            background-color: #fcceee;
            border-radius: 10rem;
            transition: background-color 0.3s ease-in-out;
        }
        .c-pill-colour-changing:hover {
            background-color: #a5c2fb;
    </style>
</body>
</html>
